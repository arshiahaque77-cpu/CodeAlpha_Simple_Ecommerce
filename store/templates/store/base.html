<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
    <header class="container">
        <nav>
            <ul>
                <li><strong><a href="{% url 'product_list' %}" style="text-decoration: none;">CodeAlpha Store</a></strong></li>
            </ul>
            <ul>
                <li><a href="{% url 'product_list' %}">Home</a></li>
                <li><a href="{% url 'cart_detail' %}">Cart</a></li>
                
                {% if user.is_authenticated %}
                    <li>
                        <form action="{% url 'logout' %}" method="post" style="display: inline; margin: 0;">
                            {% csrf_token %}
                            <button type="submit" class="outline secondary" style="padding: 4px 10px; font-size: 0.9rem;">Logout ({{ user.username }})</button>
                        </form>
                    </li>
                {% else %}
                    <li><a href="{% url 'login' %}">Login</a></li>
                    <li><a href="{% url 'register' %}" role="button">Register</a></li>
                {% endif %}
                
                <li><a href="/admin/">Admin</a></li>
            </ul>
        </nav>
    </header>
    
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
